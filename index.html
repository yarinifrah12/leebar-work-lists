<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>חלוקת עבודה יומית</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
/* Layout: Swiss-minimal ops tool in Lee Bar colours. Brand bar → two step cards (report in, pages out) → department cards → the selected list. */
:root{
  --bg:#f5f6f8; --panel:#ffffff; --fg:#14181d; --muted:#56606b; --line:#e2e5ea; --soft:#f1f3f5;
  --brand:#c1272d; --brand-ink:#ffffff; --brand-2:#f39200; --brand-3:#5b3a1e;
  --accent:#c1272d; --warn:#8a4b00; --warn-bg:#fff4e2; --net-bg:#eaf6ef; --net:#17663b; --ok:#17663b;
  --st-butcher:#b3242a; --st-dough:#7d4f96; --st-thaw:#1f7f8c; --st-hot:#c8501a; --st-carbs:#a77400; --st-salad:#2b7a4b; --st-airport:#2c5aa8;
  --radius:12px; --shadow:0 1px 2px rgba(20,24,29,.06),0 4px 14px rgba(20,24,29,.05);
  --font-body:"IBM Plex Sans Hebrew",Arial,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111418; --panel:#1a1f25; --fg:#eceff2; --muted:#a3adb8; --line:#2c333b; --soft:#20262d;
  --brand:#c9343a; --brand-ink:#ffffff; --brand-2:#ffad3a; --brand-3:#c79a6b; --accent:#ff6b6f;
  --warn:#f3b25e; --warn-bg:#33240f; --net-bg:#14301f; --net:#7fd8a2; --ok:#7fd8a2;
  --st-butcher:#ef6b70; --st-dough:#c39ad6; --st-thaw:#6cc7d4; --st-hot:#f08a5c; --st-carbs:#e6b93a; --st-salad:#67c08c; --st-airport:#86a9ee;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418; --panel:#1a1f25; --fg:#eceff2; --muted:#a3adb8; --line:#2c333b; --soft:#20262d;
  --brand:#c9343a; --brand-ink:#ffffff; --brand-2:#ffad3a; --brand-3:#c79a6b; --accent:#ff6b6f;
  --warn:#f3b25e; --warn-bg:#33240f; --net-bg:#14301f; --net:#7fd8a2; --ok:#7fd8a2;
  --st-butcher:#ef6b70; --st-dough:#c39ad6; --st-thaw:#6cc7d4; --st-hot:#f08a5c; --st-carbs:#e6b93a; --st-salad:#67c08c; --st-airport:#86a9ee;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;direction:rtl}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* brand bar */
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;justify-content:space-between}
.brand-id{display:flex;align-items:center;gap:16px;min-width:0}
.logo{background:#fff;border-radius:10px;padding:8px 12px;display:flex;box-shadow:var(--shadow);flex:none}
.logo img{height:36px;width:auto;display:block}
h1{font-size:28px;font-weight:700;margin:0;line-height:1.2}
.date-chip{display:inline-flex;align-items:center;gap:6px;font-size:18px;font-weight:600;color:var(--muted);margin-top:2px}
.date-chip b{color:var(--fg)}
/* steps */
.steps{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.step-h{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.step-n{width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:14px;flex:none}
.dropzone{display:flex;align-items:center;gap:14px;border:2px dashed var(--line);border-radius:10px;padding:14px 16px;min-height:64px;cursor:pointer;transition:border-color .2s,background-color .2s;color:var(--muted)}
.dropzone:hover,.dropzone.over{border-color:var(--brand);background:var(--soft);color:var(--fg)}
.dropzone:focus-within{outline:2px solid var(--brand);outline-offset:2px}
.dropzone strong{color:var(--fg);display:block;font-size:15px}
.dropzone input{position:absolute;width:1px;height:1px;opacity:0}
.loaded{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ok);font-weight:600}
.out{display:flex;flex-direction:column;gap:8px}
.out-row{display:flex;flex-wrap:wrap;gap:8px}
button,.btn{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--fg);min-height:44px;padding:8px 16px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:border-color .2s,background-color .2s,transform .1s}
button:hover{border-color:var(--brand)}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
button.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
button.primary:hover{filter:brightness(1.05)}
button.big{width:100%;min-height:52px;font-size:16px}
button.sm{min-height:36px;font-size:13px;padding:4px 10px}
select,input[type=text]{font:inherit;font-size:15px;color:var(--fg);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:40px}
.hint{font-size:13px;color:var(--muted);margin:0}
.msg{padding:12px 16px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:15px;border:1px solid currentColor}
/* new dishes */
.newdish{background:var(--warn-bg);border:2px solid var(--warn);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.newdish h2{margin:0;font-size:18px;color:var(--warn);display:flex;align-items:center;gap:8px}
.newdish p{margin:0;font-size:15px}
.nd-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--panel);border-radius:10px;padding:10px 14px}
.nd-row b{font-weight:600}
.nd-row small{color:var(--muted)}
.save-note{font-size:13px;color:var(--muted)}
/* department picker */
.sec-h{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;margin:4px 0 -6px}
nav.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
nav.tabs button{min-height:64px;flex-direction:column;align-items:stretch;justify-content:center;gap:2px;padding:10px 14px;text-align:right;border-radius:10px;border-inline-start:6px solid var(--c,var(--line));background:var(--panel)}
nav.tabs .t1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
nav.tabs .cnt{font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;background:var(--soft);color:var(--muted);border-radius:99px;padding:0 8px}
nav.tabs small{font-weight:500;color:var(--muted);font-size:13px}
nav.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);border-inline-start-color:var(--c,var(--fg))}
nav.tabs button[aria-selected="true"] small{color:var(--bg);opacity:.8}
nav.tabs button[aria-selected="true"] .cnt{background:var(--c);color:#fff}
/* list */
.station{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.st-head{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;padding:16px 18px;border-top:6px solid var(--c)}
.st-head h2{font-weight:700;font-size:30px;margin:0;color:var(--c)}
.st-head h2 span{color:var(--fg);font-weight:600;font-size:18px;margin-inline-start:8px}
.st-meta{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:14px;align-items:center}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600;background:var(--soft);white-space:nowrap}
th.net{color:var(--net);background:var(--net-bg)}
td.q{white-space:nowrap;color:var(--muted)}
td.net{white-space:nowrap;font-weight:700;font-size:17px;background:var(--net-bg);color:var(--net)}
td .u{font-weight:400;font-size:13px;opacity:.85}
td.chk{width:36px}
tbody tr:not(.cat):hover td{background:var(--soft)}
tbody tr:not(.cat):hover td.net{background:var(--net-bg)}
.ru{font-size:14px;color:var(--muted);direction:ltr;text-align:right}
.rui{width:100%;min-width:180px}
td.mv,th.mv{white-space:nowrap;width:1%}
td.mv select{font-size:14px;min-height:36px}
.box{display:inline-block;width:20px;height:20px;border:2px solid var(--muted);border-radius:5px;vertical-align:middle}
tr.blank td{height:44px}
tr.new td{background:var(--warn-bg)}
tr.cat td{background:var(--soft);font-weight:700;font-size:14px;color:var(--muted);padding-block:6px}
.lines{display:flex;flex-direction:column;gap:2px}
.empty{padding:28px 18px;color:var(--muted)}
.settings{padding:4px 18px 18px;display:flex;flex-direction:column;gap:14px}
.settings h3{margin:10px 0 2px;font-size:17px}
.settings p{margin:0;color:var(--muted);font-size:14px;max-width:70ch}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 16px}
.people label{display:flex;gap:8px;align-items:center;font-size:15px}
.people input{width:100%;min-width:0}
.clients{display:flex;flex-wrap:wrap;gap:6px 16px}
.clients label{display:flex;gap:8px;align-items:center;font-size:15px;min-height:36px}
.clients input,.map input[type=checkbox]{width:18px;height:18px}
.map td{padding-block:6px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--warn-bg);color:var(--warn);margin-inline-start:6px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:10px;font-size:15px;z-index:30;box-shadow:var(--shadow)}
.busy{position:fixed;inset:0;z-index:10000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:17px;font-weight:600}
.spinner{width:40px;height:40px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:2s!important}}
@media (max-width:760px){.steps{grid-template-columns:1fr}h1{font-size:21px}.logo img{height:30px}.st-head h2{font-size:21px}th,td{padding:8px}}
</style>

const RU_DIRECT_GEN = new Set(['חזה','פילה','כבד','מרק','פשטידה']);
function autoRu(name){
  const w=name.replace(/[.,]/g,' ').split(/\s+/).filter(Boolean);
  let head=null, headKey=null; const adjs=[], tail=[], rest=[]; let hits=0;
  const G={m:0,f:1,n:2,pl:3};
  for(let i=0;i<w.length;){
    let used=0;
    for(let n=Math.min(3,w.length-i);n>0&&!used;n--){
      const s=w.slice(i,i+n).join(' ');
      if(RU_PHRASE[s]){ tail.push(RU_PHRASE[s]); used=n; }
      else if(RU_NOUN[s]){
        const [nom,g,gen]=RU_NOUN[s];
        if(!head){ head=[nom,g]; headKey=s; }
        else tail.unshift((RU_DIRECT_GEN.has(headKey)?'':'из ')+(gen||nom));
        used=n;
      }
      else if(n===1 && RU_ADJ[s]){ adjs.push(RU_ADJ[s]); used=1; }
      else if(n===1 && /^[ובה]/.test(s) && RU_NOUN[s.slice(1)] && head){
        const [nom,,gen]=RU_NOUN[s.slice(1)]; tail.push((s[0]==='ו'?'и ':'с ')+(gen||nom)); used=1; }
    }
    if(used){ hits++; i+=used; } else { rest.push(w[i]); i++; }
  }
  if(!hits) return '';
  const g = head ? G[head[1]] : 0;
  const parts=[...adjs.map(a=>a[g]), head?head[0]:'', ...tail].filter(Boolean);
  let s=parts.join(' ');
  if(rest.length) s+=' ('+rest.join(' ')+')';
  return s.charAt(0).toUpperCase()+s.slice(1);
}

/* ---------- parsing (raw daily report; also tolerates the annotated copy) ---------- */
function parseWorkbook(wb){
  const out = {date:'', clients:[], heads:{}, items:[]};
  const clientSet = new Set();
  for(const sn of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:null,raw:true});
    if(!rows.length) continue;
    const h = (rows[0]||[]).map(clean);
    const t = h.findIndex(v=>v==='סה"כ' || v==='סה"כ להכנה');
    if(t<2) continue;
    let nameCol = h.findIndex(v=>/\d{1,2}\/\d{1,2}\/\d{2,4}/.test(v));
    if(nameCol<0 || nameCol>=t) nameCol = t-2;
    if(!out.date && h[nameCol]) out.date = h[nameCol];
    const skipHdr = /סה"כ|נטו|מכין|מדור/;
    const cols=[]; for(let i=t+1;i<h.length;i++){ const c=h[i]; if(c && !skipHdr.test(c)){cols.push([i,c]); clientSet.add(c);} }
    const units = rows.slice(1).map(r=>clean(r&&r[nameCol+1]));
    const isHot = nameCol>=1 && units.filter(u=>/^(מנות|משקל|ק"ג)$/.test(u)).length>3;
    let last=null, lastCat='';
    for(let ri=1; ri<rows.length; ri++){
      const r=rows[ri]; if(!r) continue;
      const per={}; cols.forEach(([i,c])=>{ if(r[i]!=null && clean(r[i])!=='' && !String(r[i]).startsWith('=')) per[c]=r[i]; });
      if(isHot){
        const name=dish(r[nameCol]);
        if(!name){ cols.forEach(([i,c])=>{ const v=clean(r[i]); if(/מנות/.test(v) && !out.heads[c]) out.heads[c]=v; }); continue; }
        let cat=clean(r[nameCol-1])||lastCat; lastCat=cat; if(cat==='ירקני') cat='ירקנית';
        out.items.push({name, sheet:'hot', cat, unit:unitOf(r[nameCol+1]), lines:[{size:'', total:num(r[t]), per}]});
      } else {
        let name=dish(r[nameCol]);
        if(name) last=name; else name=last;
        if(!name) continue;
        if(r[t]==null) continue;
        let it=out.items.find(x=>x.sheet==='cold'&&x.name===name);
        if(!it){ it={name, sheet:'cold', cat:'קר', unit:/ק"ג/.test(name)?'ק"ג':'', lines:[]}; out.items.push(it); }
        it.lines.push({size:sizeOf(r[nameCol+1]), total:num(r[t]), per});
      }
    }
  }
  out.clients=[...clientSet];
  out.items.forEach(it=>it.lines.sort((a,b)=>num(b.size)-num(a.size)));
  return out;
}

  it.lines.filter(l=>l.total>0).forEach(l=>{ const n=l.total, m=String(l.size||'').match(/(\d+(\.\d+)?)\s*ליטר/);
    if(m){ L+=n*parseFloat(m[1]); det.push(`${fmt(n)} של ${m[1]} ליטר`); }
    else if(/מארז/.test(l.size||'')){ packs+=n; det.push(`${fmt(n)} מארזים`); }
    else { other+=n; }
  });
  const tot=[]; if(L) tot.push(`${fmt(L)} ק"ג`); /* 1 ליטר = 1 ק"ג */ if(packs) tot.push(`${fmt(packs)} מארזים`); if(other) tot.push(`${fmt(other)} ${it.unit||'מנות'}`);
  return {detail: det.length>1||L ? det.join(' | ') : '', total: tot.join(' + ')};
}

function deptRows(id){
  let cat=null; const rows=[];
  deptItems(id).forEach(it=>{
    const ru=isRu(id);
    if(it.cat!==cat){cat=it.cat; rows.push({group:(cat==='קר'?(id==='salad'?'סלטים והכנות קרות':'הכנות קרות'):cat)+(ru&&RU_CAT[cat]?' / '+RU_CAT[cat]:'')});}
    if(id==='salad'){ const s=saladSum(it); rows.push({name:it.name, detail:s.detail, net:s.total}); return; }
    netLines(it).forEach((x,i)=>rows.push({name:i?'':it.name, ru:i||!ru?'':ruName(it.name), net:fmt(x.net)+' '+x.u+(ru?' / '+ruUnit(x.u):'')}));
  });
  return rows;
}
function tamirRows(){
  const tc=terminals(); const rows=[];
  tamirItems().forEach(it=>it.lines.filter(l=>tc.some(c=>num(l.per[c]))).forEach((l,i)=>rows.push({name:i?'':it.name, dept:deptName(deptOf(it)), cells:tc.map(c=>num(l.per[c])?fmt(num(l.per[c])):''), sum:fmt(tc.reduce((a,c)=>a+num(l.per[c]),0))+' '+lineUnit(it,l)})));
  return rows;
}

    deptRows(d.id).forEach(r=>aoa.push(r.group?['',r.group]:ru?['☐',r.name,r.ru||'',r.net,'']:['☐',r.name,r.net,'']));
    if(BLANK) aoa.push(['','שורות למילוי:']); for(let i=0;i<BLANK;i++) aoa.push(ru?['☐','','','','']:['☐','','','']);
    const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=ru?[{wch:4},{wch:34},{wch:40},{wch:24},{wch:24}]:[{wch:4},{wch:36},{wch:18},{wch:28}];
    XLSX.utils.book_append_sheet(wb,ws,sheetName(d.name));
  });

function printBody(only){

  const top=d=>`<header><img class="lg" src="${LOGO}" alt=""><div class="ttl"><h1>${esc(d.name)}${isRu(d.id)?` <span class="rut">${RU_DEPT}</span>`:''}</h1>${personOf(d.id)?`<div class="who">אחראי/ת: <b>${esc(personOf(d.id))}</b></div>`:''}</div><div class="dt">${esc(R.date).replace(/\s+(\d{1,2}\/)/,'<br>$1')}</div></header>`;
  const blanks=n=>Array.from({length:BLANK},()=>`<tr class="b"><td class="c">☐</td>${'<td></td>'.repeat(n)}</tr>`).join('');
  const deptPage=d=>{ if(!want(d.id)) return ''; const rows=deptRows(d.id); if(!rows.length && only!==d.id) return ''; const ru=isRu(d.id);
    if(d.id==='salad'){ // long list: two columns side by side so it stays readable on one page
      const items=rows.filter(r=>!r.group), half=Math.ceil(items.length/2);
      const tbl=list=>`<table class="half"><thead><tr><th class="c">✓</th><th>סלט / מוצר</th><th class="n">סה"כ</th></tr></thead><tbody>${
        list.map(r=>`<tr><td class="c">☐</td><td>${esc(r.name)}</td><td class="n">${esc(r.net)}</td></tr>`).join('')
      }${Array.from({length:2},()=>'<tr class="b"><td class="c">☐</td><td></td><td></td></tr>').join('')}</tbody></table>`;
      return `<section>${top(d)}<div class="cols">${tbl(items.slice(0,half))}${tbl(items.slice(half))}</div></section>`;
    }
    return `<section>${top(d)}<table><thead><tr><th class="c">✓</th><th>מנה / מוצר${ru?' · Блюдо':''}</th><th class="n">כמות לייצור${ru?' · Количество':''}</th></tr></thead><tbody>${
      rows.map(r=>r.group?`<tr class="g"><td colspan="3">${esc(r.group)}</td></tr>`:`<tr><td class="c">${r.name?'☐':''}</td><td>${esc(r.name)}${r.ru?`<div class="ru" lang="ru">${esc(r.ru)}</div>`:''}</td><td class="n">${esc(r.net)}</td></tr>`).join('')
    }${blanks(2)}</tbody></table></section>`; };
  const tc=terminals(), tr=tamirRows();
  const tamirPage = want('airport') && (tr.length||only) ? `<section>${top(AIRPORT)}<table><thead><tr><th class="c">✓</th><th>מנה / מוצר</th><th>מחלקה</th>${tc.map(c=>`<th>${esc(shortClient(c))}</th>`).join('')}<th class="n">סה"כ</th></tr></thead><tbody>${
    tr.map(r=>`<tr><td class="c">${r.name?'☐':''}</td><td>${esc(r.name)}</td><td>${r.name?esc(r.dept):''}</td>${r.cells.map(v=>`<td>${esc(v)}</td>`).join('')}<td class="n">${esc(r.sum)}</td></tr>`).join('')
  }${blanks(tc.length+3)}</tbody></table></section>` : '';
  const secs=[...DEPTS.map(deptPage),tamirPage].filter(Boolean);
  return secs.map((s,i)=>i<secs.length-1?s.replace('<section>','<section class="pb">'):s).join('');
}

  .pdoc td.c,.pdoc th.c{width:9mm;text-align:center;font-size:15pt}.pdoc th.n{background:#cfe8d9}.pdoc td.n{font-weight:bold;font-size:14pt;background:#eef7f1;white-space:nowrap}
  .pdoc td.d{font-size:9.5pt;color:#333}.pdoc .cols{display:flex;gap:8px;align-items:flex-start}.pdoc .cols table{flex:1;width:50%}.pdoc table.half td,.pdoc table.half th{padding:3px 5px;font-size:11pt}.pdoc table.half td.n{font-size:12pt}.pdoc table.half td.d{font-size:9pt}.pdoc table.half td.c{font-size:13pt;width:7mm}.pdoc table.half tr.b td{height:8mm}.pdoc tr.g td{background:#f2f2f2;font-weight:bold}.pdoc tr{break-inside:avoid;page-break-inside:avoid}.pdoc tr.b td{height:11mm}.pdoc .ru{font-size:11pt;color:#333;direction:ltr;text-align:right}`;
function buildPrintHTML(only){
  return `<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>רשימות עבודה ${esc(R.date)}</title><style>@page{size:A4;margin:12mm}body{margin:0}${PRINT_CSS}</style></head><body><div class="pdoc" dir="rtl">${printBody(only)}</div></body></html>`;
}
function busy(on,text){ $('busy').hidden=!on; if(text) $('busyText').textContent=text; }
// One A4 page per department: render the department to a canvas, then scale it down to fit the page.
async function renderPages(ids){
  if(!window.html2canvas || !window.jspdf) throw {code:'nolib'};
  const stage=document.createElement('div');
  stage.style.cssText='position:fixed;top:0;left:0;width:760px;background:#fff;z-index:9999;direction:rtl';
  document.body.appendChild(stage);
  const sy=window.scrollY, sx=window.scrollX; window.scrollTo(0,0);
  const pages=[];
  try{
    for(const id of ids){
      // letter-spacing makes html2canvas place each letter where the browser laid it out (keeps Hebrew + Russian correct)
      stage.innerHTML=`<style>${PRINT_CSS} .pdoc,.pdoc *{letter-spacing:0.01px}</style><div class="pdoc" dir="rtl">${printBody(id)}</div>`;
      await Promise.all([...stage.querySelectorAll('img')].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
      const snap=()=>html2canvas(stage,{scale:2,backgroundColor:'#ffffff',scrollX:0,scrollY:0,windowWidth:document.documentElement.clientWidth,windowHeight:document.documentElement.clientHeight,logging:false});
      const pageH=Math.floor(760*277/190), maxPages=MAX_PAGES[id]||1;
      if(maxPages>1 && stage.scrollHeight>pageH*1.35){ // only when one page would get too small
        // spread over two pages
        const rows=[...stage.querySelectorAll('tbody tr')], top=stage.getBoundingClientRect().top;
        const cut=stage.scrollHeight/2+30; // split evenly so both pages print at the same size
        let k=rows.findIndex(r=>r.getBoundingClientRect().bottom-top>cut); if(k<1) k=1;
        const h1=stage.querySelector('h1'), pg=document.createElement('span');
        pg.dir='ltr'; pg.style.cssText='display:inline-block;font-size:24pt;color:#c1272d;margin-right:16px'; if(h1) h1.appendChild(pg);
        pg.textContent='1/2'; rows.slice(k).forEach(r=>r.style.display='none'); const c1=await snap();
        pg.textContent='2/2'; rows.forEach((r,i)=>r.style.display=i<k?'none':'');
        const c2=await snap(); pages.push([c1,c2]);
      } else pages.push([await snap()]);
    }
  } finally { stage.remove(); window.scrollTo(sx,sy); }
  return pages;
}
const MAX_PAGES={airport:2};
function pagesToPdf(groups){
  const canvases=groups.flat();
  const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
  const W=190, H=277;
  canvases.forEach((c,i)=>{ if(i) pdf.addPage();
    let w=W, h=W*c.height/c.width; if(h>H){ h=H; w=H*c.width/c.height; }
    pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',(210-w)/2,10,w,h); });
  return pdf.output('blob');
}
const pageIds = () => [...DEPTS.filter(d=>deptItems(d.id).length).map(d=>d.id), ...(tamirItems().length?['airport']:[])];
async function buildPdf(only){ return pagesToPdf(await renderPages(only?[only]:pageIds())); }
async function offerPdf(only){
  const name = only ? deptName(only).replace(/"/g,'') : 'כל המחלקות';
  busy(true,'מכין PDF…');
  let blob; try{ blob=await buildPdf(only); }catch(e){ busy(false); toast('לא הצלחתי ליצור PDF. צריך חיבור לאינטרנט.'); return; }
  busy(false);
  offer(`${name} ${fileDate()}.pdf`, blob, `${only||'all'}-${fileDate()}.pdf`);
}
async function offer(filename,data,ascii){
  try{
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if(!dl){ // opened as a standalone file: normal browser download
      const blob=data instanceof Blob?data:new Blob([data],{type:filename.endsWith('.xlsx')?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'text/html;charset=utf-8'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=ascii||filename; document.body.appendChild(a); a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); toast('הקובץ ירד'); return; }
    await dl.save({filename,data}); toast('הקובץ נשמר');
  }catch(e){ if(e&&e.code==='declined') return; toast(e&&e.code==='rate_limited'?'כבר פתוח חלון שמירה':'השמירה לא הצליחה'); }
}
function toast(t){ const el=$('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }
const fileDate = () => (R.date.match(/\d{1,2}\/\d{1,2}\/\d{2,4}/)||[''])[0].replace(/\//g,'-');

/* ---------- events ---------- */
function load(buf, name){
  try{
    const parsed=parseWorkbook(XLSX.read(buf,{type:'array'}));
    if(!parsed.items.length) throw new Error('empty');
    R=parsed; $('msg').hidden=true; render();
  }catch(e){ $('msg').hidden=false; $('msg').textContent=`לא הצלחתי לקרוא את "${name}". צריך להעלות את קובץ האקסל של דוח הייצור, עם הגיליונות "חם" ו"קר".`; }
}
function readFile(f){ if(!f) return; const fr=new FileReader(); fr.onload=()=>load(new Uint8Array(fr.result),f.name); fr.readAsArrayBuffer(f); }
$('file').addEventListener('change',e=>{readFile(e.target.files[0]); e.target.value='';});
const drop=$('drop');
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
document.addEventListener('drop',e=>readFile(e.dataTransfer.files[0]));
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]'); if(!b) return; tab=b.dataset.tab; local.set('tab',tab); render();});
function onChange(e){
  const t=e.target;
  if(t.dataset.move!=null && t.value){
    const moves={...(CFG.moves||{})}; moves[R.date]={...(moves[R.date]||{}),[t.dataset.move]:t.value};
    const keep=Object.keys(moves).slice(-14); CFG.moves=Object.fromEntries(keep.map(k=>[k,moves[k]]));
    saveCfg(); render(); toast(`${t.dataset.move} הועבר היום ל${deptName(t.value)}`); return; }
  if(t.dataset.dish!=null){ CFG.assign={...(CFG.assign||{}),[t.dataset.dish]:t.value||undefined}; if(!t.value) delete CFG.assign[t.dataset.dish]; saveCfg(); const id=t.id; render(); document.getElementById(id)?.focus(); if(t.value) toast(`${t.dataset.dish} → ${t.value==='skip'?'לא להכנה':deptName(t.value)}`); return; }
  if(t.dataset.client!=null){ CFG.terminals=[...document.querySelectorAll('[data-client]')].filter(x=>x.checked).map(x=>x.dataset.client); saveCfg(); renderTabs(); return; }
}
$('view').addEventListener('change',onChange);
$('newdish').addEventListener('change',onChange);
let rt; $('view').addEventListener('input',e=>{ const n=e.target.dataset.ru; if(n==null) return; CFG.ru={...(CFG.ru||{}),[n]:e.target.value.trim()}; local.set('cfg',CFG); clearTimeout(rt); rt=setTimeout(saveCfg,700); });
let pt; $('view').addEventListener('input',e=>{ const p=e.target.dataset.person; if(p==null) return; CFG.people={...(CFG.people||{}),[p]:e.target.value}; local.set('cfg',CFG); clearTimeout(pt); pt=setTimeout(()=>{saveCfg(); renderTabs();},700); });
$('dlXlsx').addEventListener('click',()=>offer(`חלוקת עבודה ${fileDate()}.xlsx`, new Uint8Array(buildXlsx()), `work-lists-${fileDate()}.xlsx`));
$('dlPrint').addEventListener('click',()=>offerPdf(null));
async function separatePdfs(){
  const ids=pageIds(), canv=await renderPages(ids);
  return ids.map((id,i)=>({id, name:deptName(id).replace(/"/g,''), blob:pagesToPdf([canv[i]])}));
}
async function offerZip(){
  if(!window.JSZip){ toast('לא הצלחתי ליצור את הקבצים. צריך חיבור לאינטרנט.'); return; }
  busy(true,'מכין קובץ PDF לכל מחלקה…');
  let blob;
  try{
    const files=await separatePdfs(), zip=new JSZip();
    files.forEach(f=>zip.file(`${f.name} ${fileDate()}.pdf`, f.blob));
    blob=await zip.generateAsync({type:'blob'});
  }catch(e){ busy(false); toast('לא הצלחתי ליצור את הקבצים'); return; }
  busy(false);
  offer(`חלוקת עבודה ${fileDate()} - PDF לכל מחלקה.zip`, blob, `work-lists-pdf-${fileDate()}.zip`);
}
$('dlZip').addEventListener('click',offerZip);
$('view').addEventListener('click',e=>{ const u=e.target.closest('[data-unmove]'); if(!u) return;
  const m={...todayMoves()}; delete m[u.dataset.unmove]; CFG.moves={...(CFG.moves||{}),[R.date]:m}; saveCfg(); render(); toast('ההעברה בוטלה'); });
$('view').addEventListener('click',e=>{ const b=e.target.closest('[data-print]'); if(!b) return; offerPdf(b.dataset.print); });

window.__wl = {buildPdf, separatePdfs, deptName, DEPTS, ALL, buildPrintHTML, buildXlsx, get R(){return R}};
if(REPORT_B64.length>100){ const bin=atob(REPORT_B64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); load(u,REPORT_NAME); }
